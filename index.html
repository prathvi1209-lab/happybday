<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Birthday Kirty 🎉</title>
<style>
body {
  margin:0;
  overflow:hidden;
  background:linear-gradient(to top, #000428, #004e92);
  font-family: Arial, sans-serif;
  text-align:center;
  color:white;
}

canvas {
  position:absolute;
  top:0;
  left:0;
}

#startBtn {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:2rem;
  background:rgba(0,0,0,0.5);
  cursor:pointer;
  z-index:10;
}

.message {
  position:absolute;
  top:40%;
  width:100%;
  font-size:3rem;
  font-weight:bold;
  animation:fadeIn 3s ease-in-out forwards;
  opacity:0;
}

.note {
  position:absolute;
  top:55%;
  width:100%;
  font-size:1.2rem;
  padding:0 20%;
  animation:fadeIn 6s ease-in-out forwards;
  opacity:0;
}

@keyframes fadeIn {
  to { opacity:1; }
}
</style>
</head>

<body>

<div id="startBtn">Click to Surprise Kirty 🎉</div>

<audio id="music">
  <source src="aud.mp3" type="audio/mpeg">
</audio>

<canvas id="canvas"></canvas>

<div class="message">Happy Birthday Kirty 🎂🎉</div>

<div class="note">
Kirty, I hope this becomes the most beautiful birthday of your life.  
May your smile always shine brighter than the stars in the sky.  
Wishing you happiness, love and endless joy today and always. 💖
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const music = document.getElementById("music");
const startBtn = document.getElementById("startBtn");

startBtn.onclick = function(){
  startBtn.style.display = "none";
  music.play();
  startFireworks();
};

// ⭐ Stars
function drawStars(){
  for(let i=0;i<100;i++){
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(Math.random()*canvas.width,
            Math.random()*canvas.height,
            1.5,0,Math.PI*2);
    ctx.fill();
  }
}
drawStars();

// 🎆 Fireworks
let fireworks=[];

function createFirework(){
  let x=Math.random()*canvas.width;
  let y=Math.random()*canvas.height/2;
  let particles=[];
  for(let i=0;i<50;i++){
    particles.push({
      x:x,
      y:y,
      angle:Math.random()*Math.PI*2,
      speed:Math.random()*4+1,
      life:60
    });
  }
  fireworks.push(particles);
}

function startFireworks(){
  setInterval(createFirework,1000);
  animate();
}

function animate(){
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  fireworks.forEach(fw=>{
    fw.forEach(p=>{
      p.x+=Math.cos(p.angle)*p.speed;
      p.y+=Math.sin(p.angle)*p.speed;
      p.life--;
      ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
      ctx.beginPath();
      ctx.arc(p.x,p.y,2,0,Math.PI*2);
      ctx.fill();
    });
  });
  
  requestAnimationFrame(animate);
}
</script>

</body>
</html>
