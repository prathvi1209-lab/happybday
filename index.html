<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Question for Anushka ❤️</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  overflow:hidden;
  background:linear-gradient(#ff9a9e,#fad0c4);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

#box{
  background:white;
  padding:40px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  z-index:2;
}

h1{
  color:#ff3366;
}

button{
  padding:12px 25px;
  margin:10px;
  font-size:18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

#yes{
  background:#ff4d6d;
  color:white;
}

#no{
  background:#888;
  color:white;
}

.heart{
  position:absolute;
  color:red;
  font-size:20px;
  animation:float 6s linear infinite;
}

@keyframes float{
  from{
    transform:translateY(100vh);
    opacity:1;
  }
  to{
    transform:translateY(-10vh);
    opacity:0;
  }
}
</style>
</head>

<body>

<div id="box">
<h1 id="question">Anushka, will you be my GF? ❤️</h1>

<div id="buttons">
<button id="yes" onclick="yes()">YES</button>
<button id="no" onclick="no()">NO</button>
</div>

<p id="message"></p>
</div>

<script>

function yes(){
  document.getElementById("question").innerText="Prathvi is yours ❤️";
  document.getElementById("buttons").style.display="none";
  document.getElementById("message").innerText="You made the right choice 😌";
}

function no(){
  document.getElementById("message").innerText="Fool! You chose wrong 😝 Try again!";
}

function hearts(){
  const heart=document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(20+Math.random()*20)+"px";

  document.body.appendChild(heart);

  setTimeout(()=>{
    heart.remove();
  },6000);
}

setInterval(hearts,300);

</script>

</body>
</html>
